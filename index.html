    <!--
      GitHub Pages SPA fallback: public/404.html redirects any unknown
      deep-link request to /<repo>/?/<path>. This decodes that query string
      back into a real pathname via history.replaceState so React Router
      sees the correct route on load. Pair of https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
