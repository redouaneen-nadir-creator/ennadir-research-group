<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dr. En-Nadir's Group</title>
    <!--
      GitHub Pages serves this file for any unknown path (deep links,
      hard refreshes on client-side routes). We encode the intended path
      into a query string and redirect to the app root, then index.html's
      inline script restores it via history.replaceState.

      pathSegmentsToKeep = 1 because this is a GitHub *project* page
      (https://<user>.github.io/<repo>/...) — the first path segment
      (the repo name) must be preserved as the app's base path.

      Adapted from https://github.com/rafgraph/spa-github-pages (MIT).
    -->
    <script>
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
